name: Android build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:checkCoverage :app:lintDebug :app:assembleDebug
      - name: Decode release keystore (if secret present)
        if: ${{ secrets.THROW_ASSISTANT_KEYSTORE_B64 != '' }}
        env:
          THROW_ASSISTANT_KEYSTORE_B64: ${{ secrets.THROW_ASSISTANT_KEYSTORE_B64 }}
        run: echo "$THROW_ASSISTANT_KEYSTORE_B64" | base64 --decode > /tmp/throw-assistant.keystore
      - name: Assemble signed release APK (if keystore present)
        if: ${{ secrets.THROW_ASSISTANT_KEYSTORE_B64 != '' }}
        env:
          THROW_ASSISTANT_KEYSTORE_PATH: /tmp/throw-assistant.keystore
          THROW_ASSISTANT_STORE_PASSWORD: ${{ secrets.THROW_ASSISTANT_STORE_PASSWORD }}
          THROW_ASSISTANT_KEY_ALIAS: ${{ secrets.THROW_ASSISTANT_KEY_ALIAS }}
          THROW_ASSISTANT_KEY_PASSWORD: ${{ secrets.THROW_ASSISTANT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: throw-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/jacoco/
