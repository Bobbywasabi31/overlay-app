name: Android build
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify manifest privacy guards
        run: |
          # Item 59: backups must stay disabled (no app data leaves the device).
          if ! grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml; then
            echo "FAIL: android:allowBackup must be false"
            exit 1
          fi
          if grep -q 'android:fullBackupContent="@' app/src/main/AndroidManifest.xml; then
            echo "FAIL: android:fullBackupContent must not reference a backup rules file"
            exit 1
          fi
          # Item 69: the app must never request network access.
          if grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml; then
            echo "FAIL: android.permission.INTERNET must stay absent"
            exit 1
          fi
          echo "Manifest privacy guards OK: no backup, no INTERNET permission."
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:checkCoverage :app:lintDebug :app:assembleDebug
      - name: Benchmark (informational, never blocks)
        # Task 21: the wall-clock analyzer benchmark is quarantined out of the
        # gating tests because it flaked on shared CI runners. Timing is still
        # recorded here, but a noisy runner can never fail the build.
        continue-on-error: true
        run: ./gradlew --no-daemon :app:benchmark
      - name: Assemble signed release APK when keystore secret exists
        env:
          THROW_ASSISTANT_KEYSTORE_B64: ${{ secrets.THROW_ASSISTANT_KEYSTORE_B64 }}
          THROW_ASSISTANT_STORE_PASSWORD: ${{ secrets.THROW_ASSISTANT_STORE_PASSWORD }}
          THROW_ASSISTANT_KEY_ALIAS: ${{ secrets.THROW_ASSISTANT_KEY_ALIAS }}
          THROW_ASSISTANT_KEY_PASSWORD: ${{ secrets.THROW_ASSISTANT_KEY_PASSWORD }}
        run: |
          if [ -n "$THROW_ASSISTANT_KEYSTORE_B64" ]; then
            echo "$THROW_ASSISTANT_KEYSTORE_B64" | base64 --decode > /tmp/throw-assistant.keystore
            THROW_ASSISTANT_KEYSTORE_PATH=/tmp/throw-assistant.keystore ./gradlew --no-daemon :app:assembleRelease
          else
            echo "No keystore secret configured; skipping signed release build."
          fi
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: throw-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/jacoco/
